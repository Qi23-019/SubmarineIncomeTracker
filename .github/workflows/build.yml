name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Download Dalamud Dev
      run: |
        $dalamudDir = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
        New-Item -ItemType Directory -Force -Path $dalamudDir
        Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:TEMP\dalamud.zip"
        Expand-Archive -Path "$env:TEMP\dalamud.zip" -DestinationPath $dalamudDir -Force

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SubmarineIncomeTracker
        path: bin/Release/net10.0-windows/
