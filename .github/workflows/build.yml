name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '10.0.x'

    - name: Setup Dalamud
      run: |
        mkdir "$env:APPDATA\XIVLauncher\addon\Hooks\dev\"
        $url = "https://github.com/goatcorp/dalamud-distrib/raw/main/latest.zip"
        Invoke-WebRequest -Uri $url -OutFile "dalamud.zip"
        Expand-Archive -Path "dalamud.zip" -DestinationPath "$env:APPDATA\XIVLauncher\addon\Hooks\dev\"

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: SubmarineIncomeTracker
        path: bin/Release/net10.0-windows/
